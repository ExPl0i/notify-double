name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Restore the signing key
        env:
          SIGNING_KEYSTORE_BASE64: ${{ secrets.SIGNING_KEYSTORE_BASE64 }}
        run: echo "$SIGNING_KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.p12"

      - name: Unit tests and signed release APK
        env:
          SIGNING_STORE_FILE: ${{ runner.temp }}/release.p12
          SIGNING_STORE_PASSWORD: ${{ secrets.SIGNING_STORE_PASSWORD }}
          SIGNING_KEY_ALIAS: ${{ secrets.SIGNING_KEY_ALIAS }}
        run: gradle testDebugUnitTest assembleRelease

      - name: Check the signature
        run: |
          BUILD_TOOLS=$(ls -d "$ANDROID_HOME"/build-tools/*/ | sort -V | tail -1)
          "${BUILD_TOOLS}apksigner" verify --print-certs app/build/outputs/apk/release/app-release.apk

      - name: Create the release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          VERSION="${TAG#v}"
          APK="notify-double-$VERSION.apk"
          cp app/build/outputs/apk/release/app-release.apk "$APK"
          NOTES="docs/releases/$TAG.md"
          if [ -f "$NOTES" ]; then
            gh release create "$TAG" "$APK" --title "Notify Double $VERSION" --notes-file "$NOTES"
          else
            gh release create "$TAG" "$APK" --title "Notify Double $VERSION" --generate-notes
          fi
          rm -f "$RUNNER_TEMP/release.p12"
